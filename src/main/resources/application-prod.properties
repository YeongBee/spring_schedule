# ==========================================
# prod 프로필 : Oracle DB (운영, 컨테이너 2대 공유 DB)
# 접속 정보는 컨테이너 환경변수로 주입 (DB_URL, DB_USERNAME, DB_PASSWORD)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=false

# JPA : 운영 스키마는 자동 변경하지 않고 매핑 검증만 수행
#   -> 최초 1회 src/main/resources/db/oracle/schedule_history.sql 실행 필요
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Quartz : 컨테이너 2대 동시 기동 시 DDL 충돌 방지를 위해 자동 생성하지 않음
#   -> 최초 1회 quartz jar 내 org/quartz/impl/jdbcjobstore/tables_oracle.sql 실행 필요
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.oracle.OracleDelegate
