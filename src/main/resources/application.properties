spring.application.name=schejulde

# 프로필 미지정 시 기본값은 local(H2). 운영 배포 시 SPRING_PROFILES_ACTIVE=prod 로 실행
spring.profiles.default=local

# ==========================================
# Graceful Shutdown (롤링 배포 시 실행 중인 Job 보호)
# 컨테이너 종료 신호(SIGTERM)를 받으면 새 요청/트리거는 받지 않고, 실행 중인 Job 이 끝날 때까지 대기
# ※ 오케스트레이터 종료 유예 시간(k8s terminationGracePeriodSeconds 등)은 아래 timeout 보다 길게 설정할 것
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true

# ==========================================
# Quartz 공통 설정 (local / prod 공통)
# ==========================================
spring.quartz.job-store-type=jdbc
# JobDataMap 을 Java 직렬화 객체가 아닌 String 키-값(Properties)으로 저장 -> 클래스/JDK 버전 변경에도 안전
spring.quartz.properties.org.quartz.jobStore.useProperties=true
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# 다중 컨테이너(2대 이상) 환경에서 1대만 실행되도록 클러스터링 활성화
spring.quartz.properties.org.quartz.scheduler.instanceName=clusteredScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=10000
